<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="哇哇指示牌：点击一次箭头，听一声哇。一个适配桌面端和 Web 端的轻量网页小游戏。">
  <meta property="og:title" content="哇哇指示牌 · 点击一下，哇一声">
  <meta property="og:description" content="每点一次箭头，只播一次哇。">
  <meta property="og:type" content="website">
  <title>哇哇指示牌 · 点击一下，哇一声</title>
  <style>
    :root {
      --paper: #f7f1e7;
      --paper-deep: #eee3d2;
      --ink: #17233c;
      --muted: #6e716f;
      --blue: #0757bc;
      --blue-deep: #063883;
      --orange: #f36d25;
      --yellow: #ffc928;
      --green: #51a65a;
      --shadow: 0 22px 55px rgba(24, 41, 64, .16);
      --serif: "Songti SC", "STSong", "Noto Serif SC", serif;
      --sans: Inter, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      color: var(--ink);
      font-family: var(--sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: "";
      opacity: .52;
      background:
        radial-gradient(circle at 16% 16%, rgba(243, 109, 37, .12), transparent 28%),
        radial-gradient(circle at 92% 20%, rgba(7, 87, 188, .13), transparent 26%),
        linear-gradient(135deg, rgba(255,255,255,.56), transparent 48%);
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 0 8px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border: 3px solid #fff;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(31, 44, 59, .16);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
    }

    .brand-copy strong {
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1;
      letter-spacing: .08em;
    }

    .brand-copy small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px 9px 11px;
      border: 1px solid rgba(23, 35, 60, .16);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.56);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .github-link:hover {
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(7, 87, 188, .12);
      transform: translateY(-2px);
    }

    .github-mark {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .game-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 286px);
      gap: clamp(24px, 5vw, 74px);
      align-items: center;
      width: min(1280px, calc(100% - 40px));
      min-height: calc(100svh - 128px);
      margin: 0 auto;
      padding: 14px 0 24px;
    }

    .stage {
      display: grid;
      align-content: center;
      min-width: 0;
    }

    .title-block {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 auto 18px;
      width: min(960px, 100%);
    }

    .title-block h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(30px, 4vw, 56px);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1.08;
    }

    .title-block h1 span { color: var(--orange); }

    .title-block p {
      max-width: 250px;
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
      line-height: 1.8;
      text-align: right;
    }

    .sign-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      padding: 4px 0 10px;
    }

    .sign-shadow {
      position: absolute;
      bottom: 0;
      left: 12%;
      width: 76%;
      height: 25px;
      border-radius: 50%;
      background: rgba(16, 38, 79, .2);
      filter: blur(17px);
      transform: rotate(-2deg);
    }

    .sign-card {
      position: relative;
      z-index: 1;
      width: min(960px, 100%);
      aspect-ratio: 2.82 / 1;
      overflow: hidden;
      border-radius: 4%;
      transform: rotate(-1.3deg);
      transition: transform .18s cubic-bezier(.16, 1.4, .4, 1), filter .25s ease;
    }

    .sign-card::before {
      position: absolute;
      inset: 2.6%;
      border-radius: 6%;
      content: "";
      background: linear-gradient(110deg, rgba(255,255,255,.28), transparent 29%, transparent 72%, rgba(0,0,0,.16));
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .sign-card::after {
      position: absolute;
      top: -8%;
      left: -20%;
      z-index: 4;
      width: 15%;
      height: 116%;
      content: "";
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent);
      filter: blur(5px);
      transform: skewX(-16deg);
      pointer-events: none;
    }

    .sign-card.is-hit {
      animation: sign-hit .54s cubic-bezier(.16, 1.35, .3, 1);
    }

    .sign-card.is-hit::after { animation: shine .66s ease-out; }

    .sign-photo {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: drop-shadow(0 17px 16px rgba(10, 37, 79, .16));
      transition: opacity .28s ease;
    }

    .sign-photo-original { z-index: 0; }
    .sign-photo-clean { z-index: 1; opacity: 0; }

    .sign-card.is-clean .sign-photo-original { opacity: 0; }
    .sign-card.is-clean .sign-photo-clean { opacity: 1; }

    .distance-wrap {
      position: absolute;
      top: 57.2%;
      left: 53.5%;
      z-index: 3;
      display: flex;
      align-items: baseline;
      gap: .12em;
      color: #fff;
      transform: translateX(-50%);
      text-shadow: 0 4px 0 rgba(0, 34, 95, .12);
      opacity: 0;
      pointer-events: auto;
      transition: opacity .18s ease;
    }

    .sign-card.is-editing .distance-wrap,
    .sign-card.has-custom-distance .distance-wrap,
    .sign-card.is-arrow-active .distance-wrap { opacity: 1; }

    .distance-wrap input {
      width: 3.05em;
      padding: 0;
      border: 0;
      outline: 0;
      color: transparent;
      background: transparent;
      caret-color: transparent;
      font-family: Arial, sans-serif;
      font-size: clamp(36px, 7.1vw, 96px);
      font-weight: 900;
      line-height: 1;
      text-align: right;
      -moz-appearance: textfield;
    }

    .sign-card.is-editing .distance-wrap input,
    .sign-card.has-custom-distance .distance-wrap input,
    .sign-card.is-arrow-active .distance-wrap input {
      color: inherit;
      caret-color: #fff;
    }

    .distance-wrap input::-webkit-outer-spin-button,
    .distance-wrap input::-webkit-inner-spin-button { margin: 0; -webkit-appearance: none; }

    .distance-wrap input:focus {
      border-bottom: 3px solid rgba(255,255,255,.9);
    }

    .distance-wrap span {
      font-family: Arial, sans-serif;
      font-size: clamp(25px, 3.8vw, 54px);
      font-weight: 800;
      opacity: 0;
    }

    .sign-card.is-editing .distance-wrap span,
    .sign-card.has-custom-distance .distance-wrap span,
    .sign-card.is-arrow-active .distance-wrap span { opacity: 1; }

    .arrow-hit {
      position: absolute;
      top: 21%;
      right: 5.5%;
      z-index: 5;
      display: grid;
      width: 22%;
      height: 56%;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 22%;
      outline-offset: 8px;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .arrow-hit:focus-visible { outline: 3px solid rgba(255, 201, 40, .95); }

    .arrow-icon {
      width: 72%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 7px 0 rgba(22, 55, 117, .12));
      opacity: 0;
      transform: rotate(var(--arrow-angle, 0deg));
      transform-origin: 50% 50%;
      transition: transform .52s cubic-bezier(.16, 1.4, .3, 1), filter .2s ease;
    }

    .sign-card.is-arrow-active .arrow-icon { opacity: 1; }

    .arrow-hit:hover .arrow-icon { filter: drop-shadow(0 8px 0 rgba(22, 55, 117, .12)) brightness(1.06); }
    .arrow-hit:active .arrow-icon { filter: drop-shadow(0 3px 0 rgba(22, 55, 117, .12)); transform: rotate(var(--arrow-angle, 0deg)) scale(.88); }

    .stage-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-align: center;
    }

    .stage-note::before,
    .stage-note::after {
      display: block;
      width: 42px;
      height: 1px;
      content: "";
      background: rgba(23, 35, 60, .18);
    }

    .control-card {
      position: relative;
      align-self: center;
      padding: 28px 24px 24px;
      border: 1px solid rgba(23, 35, 60, .12);
      border-radius: 24px;
      background: rgba(255,255,255,.66);
      box-shadow: 0 18px 44px rgba(34, 45, 55, .09);
      backdrop-filter: blur(12px);
    }

    .control-card::before {
      position: absolute;
      top: 21px;
      right: 24px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      content: "";
      background: var(--orange);
      box-shadow: 14px 0 var(--yellow), 28px 0 var(--green);
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--blue);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .control-card h2 {
      max-width: 190px;
      margin: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 30px;
      line-height: 1.2;
    }

    .control-card h2 em {
      color: var(--orange);
      font-style: normal;
    }

    .control-card > p {
      margin: 16px 0 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.85;
    }

    .score {
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 17px 0 15px;
      border-top: 1px solid rgba(23, 35, 60, .12);
      border-bottom: 1px solid rgba(23, 35, 60, .12);
    }

    .score small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .score strong {
      color: var(--orange);
      font-family: Arial, sans-serif;
      font-size: 34px;
      line-height: .9;
    }

    .score strong span { font-size: 14px; }

    .tip-list {
      display: grid;
      gap: 12px;
      margin: 21px 0 25px;
      padding: 0;
      list-style: none;
    }

    .tip-list li {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .tip-list li::before {
      display: grid;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      content: attr(data-step);
      font-size: 10px;
      font-weight: 900;
    }

    .audio-state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .audio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(81,166,90,.12);
    }

    .audio-source {
      display: none;
    }

    .reset-button {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-top: 21px;
      padding: 11px 14px;
      border: 1px solid rgba(23, 35, 60, .16);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }

    .reset-button:hover {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    .footer-line {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 calc(22px + env(safe-area-inset-bottom));
      color: rgba(23, 35, 60, .48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .footer-line a { color: inherit; }

    .burst-layer {
      position: fixed;
      inset: 0;
      z-index: 8;
      overflow: hidden;
      pointer-events: none;
    }

    .wah-pop {
      position: absolute;
      left: var(--x);
      top: var(--y);
      color: var(--orange);
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 66px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 3px 4px 0 rgba(255, 201, 40, .48);
      transform: translate(-50%, -50%) rotate(var(--r));
      animation: wah-pop 850ms cubic-bezier(.16, 1.1, .3, 1) forwards;
    }

    .spark {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--color);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color) 22%, transparent);
      animation: spark 700ms ease-out forwards;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 9;
      padding: 10px 16px;
      border: 1px solid rgba(23,35,60,.12);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.86);
      box-shadow: 0 12px 28px rgba(23,35,60,.12);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
    }

    .toast.show { animation: toast-in 1.1s ease both; }

    @keyframes sign-hit {
      0% { transform: rotate(-1.3deg) scale(1); }
      28% { transform: rotate(1.4deg) scale(1.014, .985); }
      58% { transform: rotate(-.7deg) scale(.997, 1.005); }
      100% { transform: rotate(-1.3deg) scale(1); }
    }

    @keyframes shine {
      0% { left: -20%; opacity: 0; }
      20% { opacity: .9; }
      100% { left: 112%; opacity: 0; }
    }

    @keyframes wah-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.45) rotate(var(--r)); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 78px)) scale(1.15) rotate(var(--r)); }
    }

    @keyframes spark {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(.3); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); }
    }

    @keyframes toast-in {
      0% { opacity: 0; transform: translate(-50%, 12px); }
      18%, 78% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -4px); }
    }

    @media (max-width: 880px) {
      .game-shell {
        grid-template-columns: 1fr;
        gap: 30px;
        min-height: 0;
        padding-top: 22px;
      }

      .control-card {
        width: min(600px, 100%);
        margin: 0 auto;
      }

      .control-card > p { max-width: 440px; }
      .tip-list { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .topbar, .game-shell, .footer-line { width: min(100% - 24px, 1280px); }
      .topbar { padding-top: calc(12px + env(safe-area-inset-top)); }
      .brand-copy strong { font-size: 16px; }
      .brand img { width: 37px; height: 37px; }
      .github-link { padding: 8px 11px; font-size: 10px; }
      .github-mark { width: 18px; height: 18px; font-size: 12px; }
      .game-shell { padding: 20px 0 35px; }
      .title-block { align-items: start; flex-direction: column; gap: 8px; margin-bottom: 18px; }
      .title-block h1 { font-size: clamp(29px, 10vw, 44px); }
      .title-block p { max-width: none; font-size: 10px; text-align: left; }
      .sign-stage { padding: 0 0 4px; }
      .sign-card { width: 100%; aspect-ratio: 2.82 / 1; }
      .distance-wrap { left: 53.5%; }
      .arrow-hit { right: 3%; width: 24%; }
      .stage-note { margin-top: 18px; font-size: 10px; }
      .stage-note::before, .stage-note::after { width: 23px; }
      .control-card { padding: 23px 20px 20px; border-radius: 20px; }
      .control-card h2 { font-size: 26px; }
      .tip-list { grid-template-columns: 1fr; gap: 10px; }
      .footer-line { flex-direction: column; gap: 6px; font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/Juicebro-star/wah-sign-game" target="_blank" rel="noreferrer" aria-label="哇噻小游戏 GitHub 仓库">
      <img src="assets/juicebro-avatar.jpg" alt="果汁哥头像">
      <span class="brand-copy">
        <strong>果汁哥</strong>
        <small>playful web lab</small>
      </span>
    </a>
    <a class="github-link" href="https://github.com/Juicebro-star/wah-sign-game" target="_blank" rel="noreferrer">
      <span class="github-mark">⌘</span>
      <span>GitHub</span>
    </a>
  </header>

  <main class="game-shell">
    <section class="stage" aria-labelledby="game-title">
      <div class="title-block">
        <h1 id="game-title"><span>哇一下</span>，就找到公共厕所</h1>
          <p>调个距离，点一下箭头。</p>
      </div>

      <div class="sign-stage">
        <div class="sign-shadow" aria-hidden="true"></div>
        <div class="sign-card is-clean is-arrow-active" id="signCard">
          <img class="sign-photo sign-photo-original" src="assets/public-toilet-sign.png" alt="公共厕所指示牌">
          <img class="sign-photo sign-photo-clean" src="assets/public-toilet-sign-clean.png" alt="" aria-hidden="true">

          <label class="distance-wrap" for="distanceInput">
            <input id="distanceInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="450" aria-label="距离，单位米">
            <span aria-hidden="true">m</span>
          </label>

          <button class="arrow-hit" id="arrowButton" type="button" style="--arrow-angle:180deg" aria-label="箭头向下，点击改变方向并播放一次哇">
            <svg class="arrow-icon" viewBox="0 0 180 218" aria-hidden="true">
              <path fill="#fff" d="M90 8 168 91l-33 33-23-25v103H68V99l-23 25-33-33L90 8Z"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="stage-note">点箭头，方向换一格</div>
    </section>

    <aside class="control-card" aria-label="游戏说明">
      <div class="eyebrow">TOILET THIS WAY</div>
      <h2>公共厕所<br><em>往这边走</em></h2>
      <p>距离可以改，箭头一格一格转。每点一下，响一声。</p>

      <div class="score">
        <small>已经响过</small>
        <strong id="wahCount" aria-live="polite">0 <span>哇</span></strong>
      </div>

      <ol class="tip-list">
        <li data-step="1">改距离</li>
        <li data-step="2">点箭头</li>
        <li data-step="3">照着走</li>
      </ol>

      <div class="audio-state"><span class="audio-dot"></span><span id="audioState">点一下，响一声</span></div>
      <button class="reset-button" id="resetButton" type="button">恢复原样</button>
    </aside>
  </main>

  <footer class="footer-line">
    <span>一个按钮 · 一声哇 · 果汁哥小游戏实验室</span>
    <a href="https://github.com/Juicebro-star/wah-sign-game" target="_blank" rel="noreferrer">GitHub repo ↗</a>
  </footer>

  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite">哇，方向变了</div>
  <audio class="audio-source" id="wahAudio" preload="auto" src="assets/wah-sound.wav" aria-hidden="true"></audio>

  <script>
    'use strict';

    const arrowButton = document.getElementById('arrowButton');
    const signCard = document.getElementById('signCard');
    const distanceInput = document.getElementById('distanceInput');
    const wahCount = document.getElementById('wahCount');
    const burstLayer = document.getElementById('burstLayer');
    const toast = document.getElementById('toast');
    const audioState = document.getElementById('audioState');
    const resetButton = document.getElementById('resetButton');
    const wahAudio = document.getElementById('wahAudio');

    const directions = [180, 225, 270, 315, 0, 45, 90, 135];
    let directionIndex = 0;
    let count = 0;
    let toastTimer = 0;

    function playWah() {
      const playback = wahAudio.cloneNode(true);
      playback.removeAttribute('id');
      playback.classList.add('audio-source');
      playback.volume = 1;
      playback.currentTime = 0;
      playback.addEventListener('ended', () => playback.remove(), { once: true });
      playback.addEventListener('error', () => {
        playback.remove();
        audioState.textContent = '声音文件没加载成功';
      }, { once: true });
      document.body.appendChild(playback);
      const playPromise = playback.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => {
          audioState.textContent = '原声已开 · 点一下，响一遍';
        }).catch(() => {
          playback.remove();
          audioState.textContent = '点一下后才会响';
        });
      }
    }

    function makeBurst() {
      const rect = arrowButton.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      const wah = document.createElement('span');
      wah.className = 'wah-pop';
      wah.textContent = '哇';
      wah.style.setProperty('--x', x + 'px');
      wah.style.setProperty('--y', y + 'px');
      wah.style.setProperty('--r', ((Math.random() * 18) - 9).toFixed(1) + 'deg');
      wah.style.setProperty('--dx', ((Math.random() * 46) - 23).toFixed(1) + 'px');
      burstLayer.appendChild(wah);
      wah.addEventListener('animationend', () => wah.remove(), { once: true });

      const colors = ['#f36d25', '#ffc928', '#0757bc', '#51a65a'];
      for (let i = 0; i < 8; i += 1) {
        const spark = document.createElement('i');
        spark.className = 'spark';
        spark.style.setProperty('--x', x + 'px');
        spark.style.setProperty('--y', y + 'px');
        spark.style.setProperty('--size', (5 + Math.random() * 7).toFixed(1) + 'px');
        spark.style.setProperty('--color', colors[i % colors.length]);
        spark.style.setProperty('--dx', ((Math.random() * 150) - 75).toFixed(1) + 'px');
        spark.style.setProperty('--dy', ((Math.random() * 120) - 85).toFixed(1) + 'px');
        burstLayer.appendChild(spark);
        spark.addEventListener('animationend', () => spark.remove(), { once: true });
      }
    }

    function showToast() {
      window.clearTimeout(toastTimer);
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1100);
    }

    function updateDirection() {
      directionIndex = (directionIndex + 1) % directions.length;
      const angle = directions[directionIndex];
      arrowButton.style.setProperty('--arrow-angle', angle + 'deg');
      signCard.classList.add('is-arrow-active');
      signCard.classList.add('is-clean');
      arrowButton.setAttribute('aria-label', '箭头方向已改变，点击再次改变并播放一次哇');
    }

    function triggerWah() {
      updateDirection();
      count += 1;
      wahCount.innerHTML = count + ' <span>哇</span>';
      signCard.classList.remove('is-hit');
      void signCard.offsetWidth;
      signCard.classList.add('is-hit');
      makeBurst();
      showToast();
      playWah();
      arrowButton.blur();
    }

    arrowButton.addEventListener('click', triggerWah);

    window.addEventListener('keydown', (event) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (event.code === 'Space' && tag !== 'INPUT' && document.activeElement !== arrowButton) {
        event.preventDefault();
        triggerWah();
      }
    });

    resetButton.addEventListener('click', () => {
      directionIndex = 0;
      arrowButton.style.setProperty('--arrow-angle', '180deg');
      arrowButton.setAttribute('aria-label', '箭头向下，点击改变方向并播放一次哇');
      distanceInput.value = '450';
      signCard.classList.remove('is-editing', 'has-custom-distance');
      signCard.classList.add('is-arrow-active', 'is-clean');
      toast.textContent = '已恢复原样';
      showToast();
      window.setTimeout(() => { toast.textContent = '哇，方向变了'; }, 1200);
    });

    distanceInput.addEventListener('input', () => {
      const digits = distanceInput.value.replace(/\D/g, '').slice(0, 4);
      distanceInput.value = digits;
      signCard.classList.add('has-custom-distance');
      signCard.classList.add('is-clean');
    });

    distanceInput.addEventListener('focus', () => {
      signCard.classList.add('is-editing', 'is-clean');
    });
    distanceInput.addEventListener('blur', () => {
      signCard.classList.remove('is-editing');
      signCard.classList.toggle('has-custom-distance', distanceInput.value !== '450');
      if (!signCard.classList.contains('is-arrow-active') && distanceInput.value === '450') {
        signCard.classList.remove('is-clean');
      }
    });
  </script>
</body>
</html>
